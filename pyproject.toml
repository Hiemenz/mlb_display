[tool.poetry]
name = "mlb-display"
version = "0.1.0"
description = ""
authors = ["hiemenz <kevinhiemenz1@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
pillow = "^11.1.0"
requests = "^2.31.0"
pytz = "^2024.1"
regex = "^2026.1.15"
pyyaml = "^6.0.0"
pyreadr = "^0.5.4"
imageio = {extras = ["ffmpeg"], version = "^2.37.3", python = ">=3.10"}
cairosvg = {version = ">=2.9.0", python = ">=3.10"}

[tool.poetry.group.dev.dependencies]
pytest = {version = "^9.0.0", python = ">=3.10"}

[tool.pytest.ini_options]
# The real test suite lives in tests/. Scripts under src/ (hardware probes,
# stale standalone checks) are not collected.
testpaths = ["tests"]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
