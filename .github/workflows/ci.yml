name: CI

on:
  push:
    branches: [main]        # only run on main merges…
  pull_request:             # …and on every PR (this covers feature branches)

# Cancel an in-progress run when you push again to the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: poetry          # caches the resolved deps keyed on poetry.lock

      - name: Install dependencies
        run: poetry install --no-root

      - name: Syntax check
        run: poetry run python -m py_compile src/*.py

      - name: Lint (ruff)
        run: poetry run ruff check .

      - name: Type check (mypy)
        run: poetry run mypy

      - name: Tests
        run: >-
          poetry run pytest -q --tb=short
          --cov --cov-report=term-missing --cov-report=xml

      - name: Coverage summary
        if: always()
        run: |
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          poetry run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
