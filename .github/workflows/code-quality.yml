name: Code Quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install code-quality
        run: pip install "git+https://github.com/Hiemenz/code-quality.git"

      - name: Scan
        run: python -m codequality scan --baseline .codequality-baseline.json --no-color
