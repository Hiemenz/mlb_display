name: Auto-merge

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

jobs:
  enable:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
        env:
          # A personal token makes the merge run as the user, so GitHub's delete-branch-on-merge
          # and push-triggered workflows (ci.yml on main, docs-update.yml) fire; a merge made
          # with GITHUB_TOKEN triggers neither. Falls back to GITHUB_TOKEN when unset.
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
