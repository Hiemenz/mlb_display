# Reading order for comic strips whose dataset panel numbers are wrong.
#
#   "YYYY-MM-DD": [squares, listed left to right]
#
# Squares are numbered from 0 in the dataset's order, counting only usable ones.
# So [1, 0, 2, 3] shows the dataset's second square first. Every square must be
# listed exactly once, or the line is ignored. Keep the quotes around the date.
# After editing, rebuild: uv run --group comics python scripts/build_comic_cache.py --force
#
# Orders were worked out by reading each strip's dialogue and action; fix any by hand.
