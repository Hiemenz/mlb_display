# MLB Display Configuration
# scoreboard: true = 15 game grid, false = 2 detailed linescores + standings
scoreboard: true
primary: NYY
primary_backup: BOS
primary_backup_2: NYM
secondary: NYY_DOUBLE
secondary_backup: LIVE
secondary_backup_2: STL
update_interval: 14
max_live_game_calls: 15
fetch_last_play: true

# Timezone for game start times (IANA timezone string, e.g. America/Chicago, America/New_York)
timezone: America/Chicago

# Sport ID Priority List (checked in order, first with games is used)
# 1  = MLB
# 8  = World Baseball Classic
# 11 = College Baseball
# 12 = Triple-A (AAA)
# 13 = Double-A (AA)
# 14 = Winter Leagues
# 16 = Spring Training
# 51 = International
sport_id_priority:
  - 1   # MLB (highest priority)
  - 8   # World Baseball Classic
  - 16  # Spring Training
  - 51
  - 11
  - 14

# Night mode: skip refreshes between night_start and night_end (24-hour format)
night_mode: true
night_start: 0   # midnight (hour in 24h, local timezone)
night_end: 7     # 7am

# Leaders and hot streaks
fetch_leaders: false  # Set to true to fetch/display league leaders and hot streaks
leaders_refresh_hours: 6  # How often to refresh leaders data (hours)

# Transaction ticker
show_transactions: false  # Show recent roster moves at top of scoreboard
