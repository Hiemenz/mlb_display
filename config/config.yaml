# MLB Display Configuration
# scoreboard: true = 15 game grid, false = 2 detailed linescores + standings
scoreboard: true

# Display mode: "scoreboard" | "linescore" | "field" | "scorecard" | "pitch" | "derby"
# If set, overrides the scoreboard: true/false flag above.
# "field"     = single-game field diagram with runners, hit location, strike zone overlay
# "scorecard" = official scorer-style per-batter at-bat grid for both teams
# "pitch"     = full strike zone with pitch locations for current at-bat
# "derby"     = Home Run Derby single-elimination bracket. Auto-fetched from MLB's Stats API
#               (src/fetch_derby.py) each run and cached to data/derby_bracket.json; falls back
#               to the last cached file if the event hasn't started yet or the fetch fails.
#               Setting display_mode to "derby" here forces it on unconditionally. You normally
#               don't need to — see auto_derby_mode below.
display_mode: "scoreboard"

# Automatically switch to the Home Run Derby bracket (see "derby" above) on the actual Derby
# date, but only on days with no games to show (e.g. the All-Star break) — days with real games
# always take priority. Set to false to disable and rely solely on display_mode above.
auto_derby_mode: true

primary: NYY
primary_backup: BOS
primary_backup_2: NYM

# Favorite team first: when true, the primary team's game is always shown
# in the top-left slot of the scoreboard grid.
favorite_team_first: true
secondary: NYY_DOUBLE
secondary_backup: LIVE
secondary_backup_2: STL
update_interval: 14
live_game_interval: 0
max_live_game_calls: 15

# Timezone for game start times (IANA timezone string, e.g. America/Chicago, America/New_York)
timezone: America/Chicago

# League mode: "mlb" or "aaa"
# "mlb" — show MLB games + AL/NL standings (uses sport_id_priority list below)
# "aaa" — show Triple-A games + IL/PCL standings (forces sport_id=11, ignores priority list)
league_mode: mlb

# Sport ID Priority List (checked in order, first with games is used)
# Only used when league_mode is "mlb".
# 1  = MLB
# 8  = World Baseball Classic
# 11 = Triple-A (AAA)
# 12 = Double-A (AA)
# 13 = High-A
# 14 = Single-A
# 16 = Spring Training
# 51 = International
sport_id_priority:
  - 1   # MLB (highest priority)
  - 8   # World Baseball Classic
  - 16  # Spring Training
  - 51
  - 11
  - 14

# Night mode: skip refreshes between night_start and night_end (24-hour format)
night_mode: true
night_start: 2   # 2am (hour in 24h, local timezone)
night_end: 7     # 7am

# Morning alternating mode: between night_end and morning_end, alternate between yesterday's
# results and today's schedule every 5 minutes. Before night_end always shows yesterday;
# at/after morning_end always shows today.
morning_alternate_games: true
morning_end: 9          # weekday cutoff (Mon–Fri)
morning_end_weekend: 11 # weekend cutoff (Sat–Sun)


# Auto dark/light mode: display is dark (inverted) between dark_start and dark_end,
# light the rest of the day. No manual dark_mode toggle needed.
# Kept separate from night_start/night_end (the refresh-skip window above) — if they
# were the same, dark mode would only ever be true while refreshes are being skipped,
# so the display would never actually be seen in dark mode.
# A full e-ink refresh is forced on the day↔night transition to prevent ghosting.
dark_start: 20  # 8pm
dark_end: 7     # 7am

# Team logos: display PNG logos instead of 3-letter abbreviations
# Requires logo files in pic/logos/{ABBR}.png — run src/download_logos.py to fetch them
# Falls back to text abbreviation when a logo file is missing
use_team_logos: True

# Show AL/NL division standings as vertical logo strips on the left/right edges of the scoreboard.
# AL (East/Central/West) on the left, NL on the right. Teams ordered 1st (top) to 5th (bottom).
# Standings are cached in data/standings.json and only re-fetched when a game goes Final.
# Run `python src/standings.py` once to seed the cache before enabling this.
show_standings_sidebar: true

# Show AL/NL wildcard standings as a compact horizontal strip at the very top of the scoreboard.
# AL top-10 left-to-right on the left half, NL top-10 right-to-left on the right half.
# Rank 1 is at the outer edge; teams converge toward center. Shows abbr + games back per slot.
# When enabled, replaces the standings sidebar. Seeded by the same standings refresh cycle.
# Run `python src/standings.py` once to seed the cache, then wildcard refreshes automatically.
show_wildcard_standings: true

# Show postseason bracket in the top header strip instead of wildcard standings.
# Fetches series win totals via the MLB schedule API (gameType F/D/L/W).
# Auto-toggles on during the postseason calendar window (mid-Sept to mid-Nov)
# once real bracket data exists — no manual flip needed each October. Falls
# back to wildcard standings the rest of the year. Set to false to disable
# the bracket entirely (always shows wildcard standings instead, if enabled).
show_playoff_bracket: true

# Overflow ticker: when a live game's triple/wide tile crowds another game off
# the 5x3 grid (or there are simply >15 games), the bumped games are shown as
# a compact "Away v Home <status>" strip in the top header instead of just
# vanishing — taking over the header strip ahead of the playoff bracket and
# wildcard standings above whenever any games are bumped. Rotates through a
# batch of them every N minutes if more are bumped than fit on screen at once.
overflow_ticker_rotation_minutes: 2

# Small logo X offset: pixels from the left edge of each score box where the small logo is placed.
# Set to 2 to align with the box edge. Increase to shift the logo right.
small_logo_x_offset: 2

# Minutes to show the per-inning linescore grid in each finished game's box after it goes Final.
# Set to a large number (e.g. 9999) to always show the linescore for finished games.

final_linescore_minutes: 60

# Win probability bar in scoreboard mode: show team logos at their win probability position during live games
# Left edge = 0% (certain loss), right edge = 100% (certain win). Only shown for In Progress games.
scoreboard_win_probability: true

# Live details in scoreboard boxes: pitch count, batter today stats + last AB result, last pitch speed.
# Adds one extra API call (live feed) per in-progress game per refresh cycle.
scoreboard_live_details: true

# Wide cell: show a 2-slot expanded tile for in-progress games with pitch zone, bases, K strip, etc.
# When false (or omitted), wide cells only appear when there are fewer than 15 games.
# When true, always show a wide cell for the in-progress game farthest into the game (by inning),
# even when there are 15+ games on the slate (one game will be dropped from the grid to make room).
wide_cell_always: false

# Wide cell featured team: when true, the wide (2-cell) tile always goes to the
# featured (primary) team's game while it is live. If the featured team's game is
# not live, the tile falls back to the in-progress game farthest along. Like
# wide_cell_always, this shows a wide cell even with 15+ games on the slate.
wide_cell_featured: false

# Triple-cell live game: when true, the featured live game gets a 3-cell (435px)
# tile — left cell (score/linescore), middle cell (pitch zone/situation), and a
# third cell showing the venue outfield wall with distance markers, the infield
# diamond, and live runner positions. Falls back to a standard wide (2-cell) tile
# when the 3-cell layout cannot fit (e.g. the game would land in the last column).
# Enabling this bypasses the live-game clustering pass so the featured game can
# always be placed at column 0 or 2 where a 3-unit tile fits.
triple_cell_live: false

# Hide non-live games: when true, games that are already finished (Final,
# Game Over, Final: Tied) or haven't started yet (Scheduled, Pre-Game,
# Warmup, Delayed Start) are dropped from the grid entirely, as long as at
# least one other game is still in progress — freeing up their slots so the
# live games can expand into wide (2-cell) or triple (3-cell) tiles instead.
# Up to 3 live games (the ones farthest along) get a triple tile when the
# freed-up slot budget allows it. The favorite team's pinned game (see
# favorite_team_first) is never hidden, regardless of its state.
# Can also be set via the HIDE_NON_LIVE_GAMES environment variable
# (true/1/yes), which overrides this value.
hide_non_live_games: false

# Season leaders panel: show HR / AVG / ERA leaders in an empty grid cell when
# fewer than 15 games are on the slate. Rotates categories every 5 minutes.
# Refreshed once per day from the MLB Stats API.
show_leaders_panel: true
leaders_rotation_minutes: 5

# Transactions ticker: show recent MLB transactions (IL moves, call-ups, signings)
# in an empty grid cell when fewer than 15 games are on the slate. Claims the
# first free slot, ahead of the leaders panel. Refreshed periodically from the
# MLB Stats API.
show_transactions_ticker: false
transactions_lookback_days: 2

# Batting lineup panel: show today's batting order for the primary team in an empty
# grid cell when fewer than 15 games are on the slate. Data comes from the schedule
# API lineups hydrate — lineup appears once the manager files the card (typically a
# few hours before first pitch). Shows 'Not Yet Posted' before then.
show_lineup_panel: false

# Trade deadline countdown panel: shows time remaining until the MLB trade deadline
# plus recent transactions. Only appears in the two weeks before the deadline
# (and auto-hides once it passes) — enabling it year-round is safe.
show_deadline_panel: true

# MLB trade deadline date/time, local ET, as announced by MLB (format: "YYYY-MM-DD HH:MM").
# There's no fixed rule for this date — the Commissioner's Office picks one each year
# (CBA allows July 28-Aug 3) to avoid a game being played at the moment of the deadline —
# so it must be updated here once MLB announces it (usually a few weeks ahead of season/deadline).
trade_deadline: "2026-08-03 18:00"

# News headlines panel: show recent MLB news in an empty grid cell when fewer
# than 15 games are on the slate. Uses ESPN's public MLB news API (no key
# needed). When news_team_only is true, headlines are filtered to the primary
# team; falls back to league-wide headlines when fewer than 3 team stories
# are found. Refreshed every 6 hours.
show_news_panel: false
news_team_only: true

# Magic / elimination numbers: show the primary team's division standings in an
# empty grid cell — the leader's row always shows its magic number; trailing
# teams show games back until their elimination number drops below 20, at
# which point that row switches to the elimination number instead (games back
# isn't very interesting once a team is genuinely on the verge of being
# eliminated). Reuses the standings already cached in data/standings.json — no
# extra API call. Only meaningful during the regular season.
show_magic_numbers: false

# Magic/elimination number badges on standings sidebar logos: overlay a tiny
# M# / E# / CL / OUT badge in the top-right corner of each team's logo in the
# sidebar. Only shown when the number is ≤ 20 games (or already clinched/out).
# Reuses standings.json — no extra API call.
sidebar_magic_badges: false

# Hot Hitters panel: show the top batting-average leaders over the last 14
# days in an empty grid cell (position players only). The MLB Stats API does
# not expose active hitting-streak counts, so this rolling-window average is
# the best available proxy for "who's been on a tear lately." Fetches once
# daily alongside the leaders panel.
show_streaks_panel: false

# Hot Arms panel: show starting pitchers with the lowest ERA over the last 14
# days in an empty grid cell. Fetched alongside the Hot Hitters panel (same
# daily cache, no extra API call).
show_scoreless_panel: false

# Debug overlay: show system uptime and last successful game-data fetch time
# in the bottom-right corner. Useful when the Pi loses network connectivity.
show_debug_overlay: true

# Config QR code: when there are fewer than 15 games (so the grid has a spare
# cell), show a QR code linking to the local config web server
# (src/config_server.py) in the first free cell instead of leaving it blank.
show_config_qr: false

# Port the config web server (src/config_server.py) listens on. Reachable at
# http://<this-machine's-LAN-IP>:<port>/ from any device on the same network.
config_server_port: 8080

# Pre-game weather footer on Scheduled/Pre-Game/Warmup tiles (temp, wind, precip%).
# Uses Open-Meteo (no API key required) with stadium coordinates from data/stadium_weather.json.
weather:
  enabled: true
  cache_ttl_minutes: 60

# Auto-generate a timelapse video after all games for the day go Final.
# Output is saved to output/scoreboard_YYYY-MM-DD.gif + .mp4.
# A sentinel file (data/video_generated_YYYY-MM-DD.done) prevents re-running.
# Set video_interval_min and video_frame_delay_ms to control fidelity vs file size.
auto_generate_video: false
video_interval_min: 5
video_frame_delay_ms: 300

